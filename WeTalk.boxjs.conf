{
  "id": "ZenMoFiShi.WeTalk",
  "name": "WeTalk 签到+视频奖励",
  "author": "@怎么肥事",
  "icon": "https://raw.githubusercontent.com/Orz-3/mini/master/Color/appstore.png",
  "repo": "https://raw.githubusercontent.com/0xiaoluli0/QX/refs/heads/main/WeTalk.js",
  "apps": [
    {
      "id": "minis.wetalk.checkin",
      "name": "WeTalk 签到+视频奖励",
      "keys": [
        "wetalk_capture_alias",
        "wetalk_video_count",
        "wetalk_video_delay",
        "wetalk_account_gap",
        "wetalk_accounts_v1"
      ],
      "settings": [
        {
          "id": "wetalk_capture_alias",
          "name": "抓包账号备注",
          "val": "",
          "type": "text",
          "placeholder": "例如：大号 / 138xxxx",
          "desc": "抓包前先填写此项，则本次抓到的账号将使用该备注名；抓包成功后会自动清空，方便下一个账号填写。留空则默认使用账号邮箱作为名称。"
        },
        {
          "id": "wetalk_video_count",
          "name": "每账号视频奖励次数",
          "val": "5",
          "type": "text",
          "placeholder": "5",
          "desc": "每个账号每次运行观看视频奖励的次数。留空或非法值则默认 5。"
        },
        {
          "id": "wetalk_video_delay",
          "name": "视频奖励间隔时间(毫秒)",
          "val": "8000",
          "type": "text",
          "placeholder": "8000",
          "desc": "同一账号两次视频奖励之间的等待时间，单位毫秒。留空或非法值则默认 8000（8秒）。"
        },
        {
          "id": "wetalk_account_gap",
          "name": "账号时间间隔(毫秒)",
          "val": "3500",
          "type": "text",
          "placeholder": "3500",
          "desc": "多账号运行时，账号之间的间隔时间，单位毫秒。留空或非法值则默认 3500（3.5秒）。"
        }
      ],
      "author": "@怎么肥事",
      "repo": "https://raw.githubusercontent.com/0xiaoluli0/QX/refs/heads/main/WeTalk.js",
      "script": "https://raw.githubusercontent.com/0xiaoluli0/QX/refs/heads/main/WeTalk.js",
      "icons": [
        "https://raw.githubusercontent.com/Orz-3/mini/master/Alpha/appstore.png",
        "https://raw.githubusercontent.com/Orz-3/mini/master/Color/appstore.png"
      ]
    }
  ]
}
